<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <style>
    .sunrich-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #EE2B2E;
      letter-spacing: 0.5px;
    }
    .line {
      fill: #EE2B2E;
    }
    .companies-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #EE2B2E;
      letter-spacing: 4px;
    }
  </style>
  <!-- Top Text: SUNRICH -->
  <text x="0" y="40" class="sunrich-text">SUNRICH</text>
  <!-- Divider Line -->
  <rect x="0" y="48" width="276" height="4" class="line" rx="1" />
  <!-- Bottom Text: COMPANIES -->
  <text x="0" y="86" class="companies-text">COMPANIES</text>
</svg>
